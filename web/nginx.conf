server {
    listen 80;
    root /usr/share/nginx/html;

    # The homepage is the React app
    location = / {
        try_files /index.html =404;
    }

    # API call goes to the Go backend. "backend" is the service name in docker-compose.yml;
    # Docker's internal DNS resolves it to the backend container.
    location = /shorten {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Anything else: serve the file if it exists (JS/CSS/favicon),
    # otherwise treat it as a short code and let the backend redirect.
    location / {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
