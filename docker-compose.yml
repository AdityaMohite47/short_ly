# One file that describes all four containers and how they connect.
# Run everything with:  docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data                       # data survives container restarts
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # creates the table on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    environment:
      # Note the hosts: "postgres" and "redis" are the service names above, not localhost.
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CODE_MAX_RETRIES: ${CODE_MAX_RETRIES}
      CACHE_TTL: ${CACHE_TTL}
    depends_on:
      postgres:
        condition: service_healthy   # don't start until postgres answers
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_BACKEND_URL: ${PUBLIC_URL}
    ports:
      # host port : container port. Bound to 127.0.0.1 so only the server itself can reach it;
      # the public goes through the host's nginx (deploy/host-nginx.conf), which handles HTTPS.
      - "127.0.0.1:${WEB_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
