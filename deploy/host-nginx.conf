# Site config for the nginx installed ON THE SERVER (not the one inside the web container).
# It receives public traffic for the subdomain and forwards it to our docker stack on 127.0.0.1:8080.
#
# Install (on the server):
#   sudo cp deploy/host-nginx.conf /etc/nginx/sites-available/shortly
#   sudo ln -s /etc/nginx/sites-available/shortly /etc/nginx/sites-enabled/shortly
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d link.adityamohite.in    # adds the HTTPS parts to this file automatically

server {
    listen 80;
    server_name link.adityamohite.in;

    location / {
        proxy_pass http://127.0.0.1:8080;   # must match WEB_PORT in .env.docker
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
